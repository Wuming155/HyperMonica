name: 构建并发布 APK

"on":
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 构建后发布到 GitHub Release
        type: boolean
        default: false
      tag_name:
        description: Release 标签名（create_release 勾选时必填），如 v1.4.1-monica
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          # 完整克隆，确保 git rev-list 能按提交数计算版本号
          fetch-depth: 0

      - name: 设置 JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: 注入签名配置（可选）
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          # 配置了 KEYSTORE_B64 等 secrets 时写入 local.properties，否则 release 走 debug 签名
          # 注意：不能用 heredoc（<<EOF），YAML 缩进会让 EOF 无法顶格，导致 bash 语法错误
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > keystore.jks
            printf 'storeFile=keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > local.properties
          fi

      - name: 校验手动发布的标签名
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true' && github.event.inputs.tag_name == ''
        run: |
          echo "::error::手动发布时必须填写 tag_name"
          exit 1

      - name: 确定版本标签
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            # 推送到 main：用提交数生成递增标签，保证每次推送都能发布新 Release
            COUNT=$(git rev-list --count HEAD)
            VERSION="v1.4.1-monica.$COUNT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            # 推送标签：直接使用该标签
            VERSION="${{ github.ref_name }}"
          else
            # 手动触发：优先用填写的 tag_name，否则用提交数兜底
            VERSION="${{ github.event.inputs.tag_name }}"
            if [ -z "$VERSION" ]; then
              VERSION="v1.4.1-monica.$(git rev-list --count HEAD)"
            fi
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: 构建 APK（debug + release）
        run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      - name: 发布到 GitHub Release
        # main 推送 / 标签推送 自动发布；手动触发仅当勾选 create_release 时发布
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
